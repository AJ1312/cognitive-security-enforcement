[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cognitive-security"
version = "1.0.0"
description = "Cognitive-State-Aware Adaptive Information Security Enforcement — Indian Patent Prototype"
authors = [{ name = "Ajitesh Sharma", email = "13ajitesh@gmail.com" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.2.0",
    "tabulate>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
]

[project.scripts]
cognitive-security = "cognitive_security.cli_runner:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
